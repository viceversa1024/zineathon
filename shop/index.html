<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zine-a-thon &middot; Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="Zine-a-thon &middot; Shop">
<meta property="og:description" content="stickers, prints, and other ephemera">
<meta property="og:url" content="https://zineathon.com/shop/">
<meta name="theme-color" content="#b00000">
<style>
  body {
    background: #fffbe6;
    color: #000;
    font-family: "Times New Roman", Times, serif;
    max-width: 640px;
    margin: 2em auto;
    padding: 0 1em;
    line-height: 1.5;
  }
  h1 { font-size: 2.4em; margin-bottom: 0; }
  hr { border: 0; border-top: 1px dashed #000; margin: 1.5em 0; }
  a { color: #0000ee; }
  a:visited { color: #551a8b; }
  .marquee {
    color: #b00;
    font-weight: bold;
    overflow: hidden;
    white-space: nowrap;
    width: 100%;
    will-change: transform;
  }
  .marquee span {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 18s linear infinite;
  }
  @keyframes scroll {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(-100%,0,0); }
  }
  .products {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5em;
    margin-top: 1em;
  }
  .product {
    flex: 0 1 calc(50% - 0.75em);
    margin: 0;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 480px) {
    .product { flex-basis: 100%; }
  }
  .product .imgwrap {
    height: 280px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .product .imgwrap a {
    display: block;
    max-width: 100%;
    max-height: 100%;
    line-height: 0;
  }
  .product img {
    max-width: 100%;
    max-height: 100%;
    border: 1px solid #000;
    background: #fff;
  }
  .product figcaption {
    margin-top: 0.6em;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .product .title { font-weight: bold; }
  .product .meta { font-style: italic; font-size: 0.95em; }
  .product .price { margin: 0.3em 0 0.6em; }
  .product .buy { margin-top: auto; }
  .buy {
    display: inline-block;
    font-family: inherit;
    font-size: 1em;
    padding: 0.4em 1em;
    border: 1px solid #000;
    background: #b00;
    color: #fffbe6;
    text-decoration: none;
    cursor: pointer;
  }
  .buy:visited { color: #fffbe6; }
  .buy:hover { background: #000; }
  .soldout {
    display: inline-block;
    font-family: inherit;
    font-size: 1em;
    padding: 0.4em 1em;
    border: 1px dashed #000;
    background: #fffbe6;
    color: #000;
    font-style: italic;
  }
  footer { margin-top: 2em; font-size: 0.85em; text-align: center; }
  .copy {
    font: inherit;
    color: #0000ee;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .copy:hover { color: #b00; }
</style>
</head>
<body>

<div class="marquee"><span>~ * ~ the zine-a-thon shop ~ * ~</span></div>

<h1>Shop</h1>
<p><em>stickers, prints, and other ephemera. ships from berkeley</em></p>
<p><a href="../">&larr; back to zine-a-thon</a></p>

<hr>

<div class="products">

  <figure class="product">
    <div class="imgwrap"><a href="../zine/zineathon3-poster.png" target="_blank" rel="noopener noreferrer"><img src="../zine/thumbs/zineathon3-poster.webp" alt="Nine Faces of the Soul sticker"></a></div>
    <figcaption>
      <div class="title">Nine Faces of the Soul sticker</div>
      <div class="meta">2&quot; &times; 2.6&quot; &middot; die-cut vinyl</div>
      <div class="price">$TBD</div>
      <!-- replace href with your Stripe Payment Link URL -->
      <a class="buy" href="#" target="_blank" rel="noopener noreferrer">Buy</a>
    </figcaption>
  </figure>

  <figure class="product">
    <div class="imgwrap"><a href="../zine/trickster.png" target="_blank" rel="noopener noreferrer"><img src="../zine/thumbs/trickster.webp" alt="Jungian Trickster sticker"></a></div>
    <figcaption>
      <div class="title">Jungian Trickster sticker</div>
      <div class="meta">2.5&quot; &times; 3.5&quot; &middot; die-cut vinyl</div>
      <div class="price">$TBD</div>
      <!-- replace href with your Stripe Payment Link URL -->
      <a class="buy" href="#" target="_blank" rel="noopener noreferrer">Buy</a>
    </figcaption>
  </figure>

</div>

<hr>

<p><em>questions? email <button type="button" class="copy" data-copy="watermah@uci.edu" onclick="(function(b){navigator.clipboard.writeText(b.dataset.copy);var t=b.textContent;b.textContent='copied!';setTimeout(function(){b.textContent=t;},1200);})(this)">watermah@uci.edu</button></em></p>

<footer>
  <p>&copy; 2026 zine-a-thon &middot; <a href="../">home</a></p>
</footer>

</body>
</html>
