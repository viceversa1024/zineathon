<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Foundations of Modern Bovination — Zine-a-thon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../viewer.css">
<style>
  #graze-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    display: none;
  }
  body.grazing { background: transparent; }
  body.grazing #graze-video { display: block; }
  #graze-toggle {
    font-family: "Times New Roman", Times, serif;
    font-size: 0.95em;
    padding: 3px 12px;
    background: #fffbe6;
    border: 1px solid #000;
    cursor: pointer;
    margin-top: 0.5em;
  }
</style>
</head>
<body>

<video id="graze-video" loop muted playsinline preload="none"></video>

<div class="viewer-header">
  <h1>Foundations of Modern Bovination</h1>
  <p class="meta">Zine-a-thon Edition 2 &middot; 2026</p>
  <p><a href="../">&larr; back to zine-a-thon</a></p>
  <p><button id="graze-toggle" type="button" aria-pressed="false">Graze</button></p>
</div>

<section class="flipbook-section">
  <div class="book-shell" id="book">
    <div class="page left-page" id="left-page"><img id="zine-left" alt="Bovination page"></div>
    <div class="page right-page" id="right-page"><img id="zine-right" alt="Bovination page"></div>
  </div>
  <div class="controls">
    <button id="prev-page" type="button">&laquo; Previous</button>
    <span class="page-info" id="page-info">Page 1</span>
    <button id="next-page" type="button">Next &raquo;</button>
  </div>
</section>

<script>
  window.ZINE = {
    title: "Foundations of Modern Bovination",
    year: 2026,
    pages: [
      "pages/1.png",  "pages/2.png",  "pages/3.png",  "pages/4.png",
      "pages/5.png",  "pages/6.png",  "pages/7.png",  "pages/8.png",
      "pages/9.png",  "pages/10.png", "pages/11.png", "pages/12.png",
      "pages/13.png", "pages/14.png", "pages/15.png", "pages/16.png",
      "pages/17.png", "pages/18.png", "pages/19.png", "pages/20.png"
    ]
  };
</script>
<script src="../viewer.js" defer></script>
<script>
  (() => {
    const video = document.getElementById('graze-video');
    const btn = document.getElementById('graze-toggle');
    if (!video || !btn) return;
    let loaded = false;
    btn.addEventListener('click', () => {
      const grazing = document.body.classList.toggle('grazing');
      btn.textContent = grazing ? 'Suspend' : 'Graze';
      btn.setAttribute('aria-pressed', String(grazing));
      if (grazing) {
        if (!loaded) {
          video.src = 'graze.mp4';
          loaded = true;
        }
        video.play();
      } else {
        video.pause();
      }
    });
  })();
</script>

</body>
</html>
