<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Human Experiments — Zine-a-thon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../viewer.css">
<style>
  #bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    display: none;
  }
  body.playing-bg { background: transparent; }
  body.playing-bg #bg-video { display: block; }
  #bg-toggle {
    font-family: "Times New Roman", Times, serif;
    font-size: 0.95em;
    padding: 3px 12px;
    background: #fffbe6;
    border: 1px solid #000;
    cursor: pointer;
    margin-top: 0.5em;
  }
  .video-credit { font-size: 0.85em; font-style: italic; }
  .video-credit a { color: #0000ee; }
</style>
</head>
<body>

<video id="bg-video" loop muted playsinline preload="none"></video>

<div class="viewer-header">
  <h1>Human Experiments</h1>
  <p class="meta">Zine-a-thon Edition 1 &middot; 2025</p>
  <p><a href="../">&larr; back to zine-a-thon</a></p>
  <p><button id="bg-toggle" type="button" aria-pressed="false">Trial</button></p>
  <p class="video-credit" id="video-credit" hidden>Video by <a href="https://www.instagram.com/futilematrimony/" target="_blank" rel="noopener noreferrer">@futilematrimony</a></p>
</div>

<section class="flipbook-section">
  <div class="book-shell" id="book">
    <div class="page left-page" id="left-page"><img id="zine-left" alt="Human Experiments page"></div>
    <div class="page right-page" id="right-page"><img id="zine-right" alt="Human Experiments page"></div>
  </div>
  <div class="controls">
    <button id="prev-page" type="button">&laquo; Previous</button>
    <span class="page-info" id="page-info">Page 1</span>
    <button id="next-page" type="button">Next &raquo;</button>
  </div>
</section>

<script>
  window.ZINE = {
    title: "Human Experiments",
    year: 2025,
    pages: [
      "pages/1.jpg",
      "pages/white.jpg",
      "pages/2.jpg", "pages/3.jpg", "pages/4.jpg", "pages/5.jpg",
      "pages/6.jpg", "pages/7.jpg", "pages/8.jpg", "pages/9.jpg",
      "pages/10.jpg", "pages/11.jpg", "pages/12.jpg", "pages/13.jpg",
      "pages/14.jpg", "pages/15.jpg", "pages/16.jpg", "pages/17.jpg",
      "pages/white.jpg",
      "pages/18.jpg"
    ]
  };
</script>
<script src="../viewer.js" defer></script>
<script>
  (() => {
    const video = document.getElementById('bg-video');
    const btn = document.getElementById('bg-toggle');
    const credit = document.getElementById('video-credit');
    if (!video || !btn) return;
    let loaded = false;
    btn.addEventListener('click', () => {
      const playing = document.body.classList.toggle('playing-bg');
      btn.textContent = playing ? 'Suspend' : 'Trial';
      btn.setAttribute('aria-pressed', String(playing));
      if (credit) credit.hidden = !playing;
      if (playing) {
        if (!loaded) {
          video.src = 'promo.mp4';
          loaded = true;
        }
        video.play();
      } else {
        video.pause();
      }
    });
  })();
</script>

</body>
</html>
